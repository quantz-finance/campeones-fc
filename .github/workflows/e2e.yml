name: e2e

on:
  push:
    branches: [web2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Supabase local y desechable (Postgres + GoTrue + PostgREST, sin Docker). Nunca toca la base compartida.
      - run: npm run e2e:stack:up
      - run: npm run e2e:build
      - run: npm run e2e
        env:
          CI: '1'
      - if: always()
        run: npm run e2e:stack:down
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            e2e/.stack/*.log
          retention-days: 7
