<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" style="background-color:#37003C;color-scheme:dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#37003C" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campeones FC" />
    <meta name="application-name" content="Campeones FC" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Modo claro/oscuro antes del primer frame (src/ui/theme-mode.ts). Oscuro por defecto.
      (function () { try { var m = localStorage.getItem('cfc-theme') === 'light' ? 'light' : 'dark'; var d = document.documentElement; d.setAttribute('data-theme', m); if (m === 'light') { d.style.backgroundColor = '#FAF9FA'; d.style.colorScheme = 'light'; } } catch (e) {} })();
    </script>
    <!-- Fondo morado desde el primer frame (antes del JS): sin destello blanco. -->
    <!-- Outfit (SIL OFL 1.1, public/fonts/OFL-Outfit.txt): una familia por peso de la fuente variable. -->
    <style id="expo-reset">
      @font-face { font-family: "Outfit_400"; src: url("/fonts/Outfit.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "Outfit_500"; src: url("/fonts/Outfit.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
      @font-face { font-family: "Outfit_600"; src: url("/fonts/Outfit.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
      @font-face { font-family: "Outfit_700"; src: url("/fonts/Outfit.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
      @font-face { font-family: "Outfit_800"; src: url("/fonts/Outfit.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
      @font-face { font-family: "Outfit_900"; src: url("/fonts/Outfit.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }

      html,
      body,
      #root {
        background-color: #37003C;
        color: #FFFFFF;
      }
      :root[data-theme="light"] body,
      :root[data-theme="light"] #root,
      :root[data-theme="light"] #boot-splash {
        background-color: #FAF9FA;
        color: #1A0A1C;
      }
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Splash de arranque: pinta en el primer frame y la app lo quita al cargar las fuentes. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.2s ease-out;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #37003C;
      }
      #boot-splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 112px;
        height: 112px;
        border-radius: 28px;
        animation: boot-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .stripe {
        display: flex;
        width: 132px;
        height: 6px;
        gap: 3px;
        animation: boot-in 0.28s 0.06s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .stripe i { flex: 1; border-radius: 999px; }
      #boot-splash span {
        font: 700 13px/1 "Outfit_700", system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #E4D4EE;
        animation: boot-in 0.28s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img, #boot-splash .stripe, #boot-splash span { animation: none; }
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
      @keyframes ticker-slide {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas JavaScript para llevar el marcador.</noscript>
    <div id="boot-splash" role="img" aria-label="Cargando Campeones FC"><img alt="" src="/bull.svg" /><div class="stripe"><i style="background:#05F0FF"></i><i style="background:#00FF87"></i><i style="background:#953BFF"></i></div><span>Campeones FC</span></div>
    <div id="root"></div>
    <script>
      // Por si la app no arranca: el splash nunca tapa la pantalla más de 10 s.
      setTimeout(function () { var s = document.getElementById('boot-splash'); if (s) s.remove(); }, 10000);
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
