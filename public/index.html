    <!-- Fondo oscuro desde el primer frame (antes del JS): sin destello blanco. -->
    <style id="expo-reset">
      html,
      body,
      #root {
        background-color: #080B13;
        color: #FFFFFF;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Splash de arranque: pinta en el primer frame y la app lo quita al cargar las fuentes. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.2s ease-out;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #080B13;
      }
      #boot-splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 112px;
        height: 112px;
        animation: boot-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .stripe {
        display: flex;
        width: 132px;
        height: 6px;
        gap: 3px;
        animation: boot-in 0.28s 0.06s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .stripe i { flex: 1; transform: skewX(-18deg); }
      #boot-splash span {
        font: 700 13px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #8E97AD;
        animation: boot-in 0.28s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img, #boot-splash .stripe, #boot-splash span { animation: none; }
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
      @keyframes ticker-slide {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
    </style>
  </head>
